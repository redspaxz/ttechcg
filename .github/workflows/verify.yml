name: Verify PHP application

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate cPanel deployment descriptor
        shell: ruby {0}
        run: |
          require "yaml"

          document = YAML.safe_load_file(".cpanel.yml")
          tasks = document.dig("deployment", "tasks")

          abort "Invalid .cpanel.yml deployment tasks" unless tasks.is_a?(Array) && tasks.all? { |task| task.is_a?(String) }

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' php_file; do
            php -l "$php_file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Run application tests
        run: php tests/run.php

      - name: Verify browser scripts
        run: |
          node --check public/assets/app.js
          node --check public/assets/analytics.js
          node --check public/assets/google-tag.js
          node --check public/assets/print.js
          node tests/analytics-consent.test.js
