name: Verify PHP application

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: pickupsheet_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, openssl, curl
          coverage: none

      - name: Validate cPanel deployment descriptor
        shell: ruby {0}
        run: |
          require "yaml"

          document = YAML.safe_load_file(".cpanel.yml")
          tasks = document.dig("deployment", "tasks")

          abort "Invalid .cpanel.yml deployment tasks" unless tasks.is_a?(Array) && tasks.all? { |task| task.is_a?(String) }

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' php_file; do
            php -l "$php_file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Check repository security invariants
        run: php bin/security-check.php

      - name: Run application tests
        run: php tests/run.php

      - name: Run MySQL integration tests
        env:
          TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=pickupsheet_test;charset=utf8mb4"
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ci-only-root
        run: php tests/mysql.php

      - name: Rekey pseudonyms against the migrated test schema
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: pickupsheet_test
          DB_USER: root
          DB_PASSWORD: ci-only-root
          SECURITY_PSEUDONYM_KEY: ci-only-pseudonym-key-not-used-anywhere-else
        run: |
          php bin/rekey-pseudonyms.php
          php bin/rekey-pseudonyms.php --apply

      - name: Verify browser scripts
        run: |
          node --check public/assets/app.js
          node --check public/assets/analytics.js
          node --check public/assets/google-tag.js
          node --check public/assets/print.js
          node tests/analytics-consent.test.js
          node tests/pickup-pagination.test.js
          node tests/consignor-autocomplete.test.js
